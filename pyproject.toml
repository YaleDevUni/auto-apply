[project]
name = "autoapply"
version = "0.2.0"
description = "채용공고 수집·필터·지원가능성 판정. 사람이 아니라 에이전트가 읽는다."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pyyaml>=6.0",
    "playwright>=1.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoapply"]

[tool.ruff]
line-length = 100
target-version = "py311"
