      - 조립공정, 포장공정, 이물검사, 라인작업
      # 수집 범위를 넓히자 87점으로 새어 들어온 것들
      - 조립팀, 생산팀, 생산직, 제조직, 품질검증, 조립 및

  DOMAIN_EXPERTISE:
    label: 비개발 전문영역
    desc: 개발과 무관한 별도 전공/실무 전문성이 전제되는 직무
