# autoapply v2 설정 — 완전 자동화용
# 이 파일만 고치면 수집 범위·필터·자동지원 기준이 바뀝니다. 코드 수정 불필요.
#
# v1과의 차이: 사람이 UI에서 고르는 것을 전제한 설정을 걷어내고,
# 에이전트가 무인으로 판단할 때 필요한 기준선(applicability)을 추가했습니다.

# ---------------------------------------------------------------
# Claude 호출 설정
#
# claude CLI는 원래 에이전트 하네스라, 그냥 부르면 시스템 프롬프트·툴 정의·
# MCP 서버·사용자 설정이 매 호출마다 얹힌다. 글 한 편 쓰는 데 필요 없는
# 비용이므로 전부 떼어낸다 (client.py의 lean 플래그).
#
# 실측 (자소서 문항 2~3개, 재작성 루프 포함 전체 소요):
#   claude-sonnet-5   →  98초 / $0.37 / 분량 92~96% (재작성 0회)
#   claude-sonnet-4-6 → 618초 / $1.46 / 재작성 2회 필요
#
# 주의: thinking_tokens=0은 짧은 프롬프트에서만 확실히 먹는다. 실제 자소서
# 프롬프트에서는 4.6도 3만 토큰 넘게 사고해 오히려 5보다 느리고 비쌌다.
# 결과적으로 sonnet-5가 속도·비용·정확도 모두 우위라 기본값으로 둔다.
# (4.6은 분량을 자주 미달해 재작성 루프가 두 번 더 돌면서 비용이 불어난다)
# ---------------------------------------------------------------
llm:
  model: claude-sonnet-5
  thinking_tokens: 0           # Sonnet 4.6에만 적용. 0이면 확장 사고 끔
  timeout_sec: 900

scrape:
  # 실제로 수집할 플랫폼. 어댑터가 있다고 전부 켜지 않습니다.
  #
  # 레시피가 없는 플랫폼을 수집하면 지원은 못 하면서 판정 통계만 오염됩니다 —
  # 사람인 2129건을 넣었더니 NO_RECIPE가 통과분의 81%를 차지해 이상 감지가
  # 계속 울렸습니다. 레시피를 만든 뒤에 켜세요.
  platforms:
    - wanted
    # - saramin     # 어댑터 검증됨(2129건). 레시피 만들면 켤 것
    # - jasoseol    # 어댑터 검증됨(818건, 이미지형 684건). 비전 판독 필요

  # 플랫폼별 페이지 수. 늘리면 더 많이 수집하지만 그만큼 느려집니다.
  wanted_pages: 3          # 직무그룹당 페이지 수 (페이지당 100건)
  saramin_pages: 3         # 검색어당 페이지 수 (페이지당 40건)
  jasoseol_enabled: true   # 한 번의 요청으로 진행중 공고 전체
  request_delay_sec: 0.7   # 요청 간 간격 (서버 예의 + 차단 방지)
  timeout_sec: 20
  max_retries: 3
  fetch_detail: true       # 원티드 상세 본문까지 받을지 (느리지만 필터 정확도 상승)
  # 상세를 받아올 최대 건수 (하드컷 통과분 우선).
  # 120이었을 때 적합 702건 중 628건이 본문 없이 남아 NO_DETAIL로 막혔다 —
  # 자동지원의 최대 병목이었다. 통과분 전체를 덮도록 올린다.
  # 비용: 건당 요청 1회 + request_delay_sec(0.7s). 800이면 약 10~12분.
  detail_limit: 800

  # 원티드 직무 그룹 ID — 실제 API 응답으로 검증한 값
  wanted_job_groups:
    - {id: 518, name: 개발}
    - {id: 507, name: 경영·비즈니스·기획}
    - {id: 523, name: 마케팅}
    - {id: 510, name: 고객서비스·CX}
    - {id: 513, name: 엔지니어링·설계}
    - {id: 517, name: HR·채용}
    - {id: 508, name: 금융·재무}
  wanted_years: 0          # 0=신입, -1=전체

  # 사람인 검색어 — 트랙별로 조준
  saramin_keywords:
    - 신입 개발자
    - 신입 백엔드
    - MES 생산관리
    - ERP 시스템 담당
    - 신입 서비스기획
    - 기술영업 신입
    - 솔루션 엔지니어
    - 신입 경영지원
    # 사람인은 검색어 기반이라 안 물어본 건 존재조차 모른다.
    # 쿠팡 '가격조사담당자'가 위 8개 어디에도 안 잡혀 통째로 빠졌다.
    - 신입 영업
    - 신입 구매
    - 신입 사무직
    - 리테일 MD
    - 정산 담당

  # 관심 기업 — 회사명으로 따로 훑는다.
  #
  # 검색어를 늘려도 특정 공고를 보장하지 못한다. 실측: 쿠팡 '가격조사담당자'는
  # '가격조사'로 검색하면 1위, '쿠팡'이면 12위인데 '신입 영업' 120건 안에는
  # 아예 없다. 사람인 검색은 관련도순이라 직무명이 정확히 맞아야 나온다.
  # 놓치면 안 되는 회사는 회사명으로 직접 훑는 것이 유일하게 확실한 방법이다.
  saramin_companies:
    - 쿠팡
    - 네이버
    - 카카오
    - 배달의민족
    - 토스
    - 당근

# ---------------------------------------------------------------
# 마감 탐지
#
# 마감일이 있는 공고는 날짜만 보면 됩니다. 문제는 상시채용인데,
# 원티드는 통과 공고의 99%가 상시라 언제 닫힐지 미리 알 방법이 없습니다.
# 대신 목록에서 사라지는 걸로 "닫혔다"를 알아냅니다.
#
# 사라짐만으로 바로 마감 처리하면 오탐이 납니다. 원티드는 직무그룹당 3페이지만
# 받으니 그 뒤로 밀린 공고가 사라진 것처럼 보이고, 사람인은 검색 순위에서
# 밀린 것과 마감을 구분할 수 없습니다. 그래서 연속으로 안 보인 것만 후보로
# 올리고, 후보만 플랫폼에 개별 확인해 확정합니다.
# ---------------------------------------------------------------
# 실측(2026-08-08): 한 번 수집 후 "목록에 없던" 공고 수
#   자소설 0건    — 진행중 공고 전량을 한 번에 받으므로 커버리지가 완전하다
#   원티드 11건   — 직무그룹당 3페이지 제한이 있어 약간 샌다
#   사람인 695건  — 검색어 기반이라 순위가 흔들리는 것뿐, 대부분 살아있다
# 그래서 플랫폼마다 기준을 다르게 둔다. 사람인은 애초에 78%가 마감일을 갖고 있어
# 사라짐 신호에 기댈 이유도 적다.
close_detection:
  enabled: true
  min_misses:
    jasoseol: 2
    wanted: 2
    saramin: 5         # 노이즈가 커서 훨씬 보수적으로
  max_verify: 100      # 한 번에 개별 확인할 최대 건수 (후보당 요청 1회)

# ---------------------------------------------------------------
# 플랫폼 간 중복 공고 묶기
# 같은 자리를 자소설·사람인·원티드가 각자 올립니다. 회사명과 제목을 정규화해
# 겹치는 것을 하나로 묶고, 대표 하나만 목록에 보여줍니다. 지우지는 않습니다.
#
# threshold — 제목 토큰의 자카드 유사도 하한. 실측으로 0.7을 골랐습니다.
#   0.67 이면 이노션 '웹 서비스 기획'과 '앱 서비스 기획'이 붙습니다(오판).
#   0.75 이면 로이드케이 '빅데이터 솔루션 엔지니어'와
#            '빅데이터 솔루션 데이터 엔지니어'를 놓칩니다(누락).
#   높이면 놓치고, 낮추면 다른 공고를 잘못 감춥니다. 감추는 쪽이 더 위험합니다.
# ---------------------------------------------------------------
# ---------------------------------------------------------------
# 자동지원 기준 (v2 신규)
#
# 여기가 무인 운영의 안전장치입니다. 사람이 지켜보지 않는 상태에서
# 에이전트가 어디까지 스스로 눌러도 되는지를 정합니다.
#
# 중복지원 방지는 이 파일이 아니라 DB가 합니다 —
# apply_ledger.canonical_key의 UNIQUE 제약이 최종 방어선입니다.
# ---------------------------------------------------------------
# ---------------------------------------------------------------
# 알림 (v2 신규)
#
# 에이전트가 스스로 못 넘는 지점(로그인 세션 끊김 등)에서 텔레그램으로 알린다.
# 승인을 기다리는 게이트가 아니라 일방향 알림이다 — 보내고 계속 진행한다.
# 토큰은 여기 두지 않는다: `python cli.py telegram-setup <봇토큰>`으로 등록.
# ---------------------------------------------------------------
notify:
  telegram:
    enabled: true
    cooldown_hours: 6   # 같은 플랫폼 알림 재전송 최소 간격. cron이 자주 돌아도 도배 안 함

# ---------------------------------------------------------------
# 지원 속도 상한 — 폭주 차단
#
# 중복지원은 canonical_key UNIQUE가 막는다. 하지만 그건 "같은 자리에 두 번"만
# 막을 뿐, "서로 다른 200개 자리에 새벽 3시에 연속 지원"은 못 막는다.
# 루프 버그 하나면 사용자 실명으로 그 일이 벌어지고, 되돌릴 수 없다.
#
# 그래서 claim() — 모든 지원이 반드시 통과하는 단 하나의 관문 — 에서 센다.
# 여기 걸리면 claim()이 None을 돌려주고, 에이전트는 그냥 조용히 멈춘다.
# ---------------------------------------------------------------
# 플랫폼에 쌓이는 이력서 정리
#
# 공고마다 이력서를 만들면 계정에 쌓인다. 플랫폼 개수 제한이 있을 수 있고,
# 실패한 시도가 남긴 것도 섞인다. 웹에서는 지우되 **로컬 사본은 남긴다** —
# profile/generated/ 의 JSON·MD가 "무엇을 보냈는지"의 기록이다.
# ---------------------------------------------------------------
# 브라우저
# ---------------------------------------------------------------
browser:
  # 창을 **한 번만 띄우고 계속 붙어 쓴다**(CDP, 포트 9222).
  #
  #     python cli.py browser-open     한 번 실행하고 그 창을 ⌘H로 숨긴다
  #
  # 그 뒤로는 새 창이 뜨지 않으므로 사람 화면을 뺏지 않는다. 실행마다
  # 브라우저가 뜨고 지는 3~5초도 사라진다.
  #
  # 숨기는 다른 방법은 전부 실패했다(실측):
  #   --headless           원티드 /cv 403
  #   --headless=new       CloudFront 403 "Request blocked"
  #   --window-position 음수  macOS가 창을 화면 안으로 되돌린다
  #   System Events 로 숨김   접근성 권한 대기로 시간 초과
  #
  # false로 두면 예전처럼 실행마다 새 창을 띄운다.
  hidden: true

resumes:
  # 이력서는 '사본 만들기'로 시작한다.
  #
  # 빈 이력서를 처음부터 채우면 완성도가 71%에서 멈췄다. 학력은 입력해도 저장이
  # 안 되고, 링크 입력칸은 TimeoutError로 못 잡았다. 그런데 그 두 섹션은
  # **공고와 무관하게 늘 같은 값**이다 — 매번 다시 채울 이유가 없다.
  # 사본은 학력·언어·링크·연락처를 완성된 채로 들고 오고, 만들자마자
  # '작성 완료' 상태다. 공고마다 달라지는 것(간단 소개·경력 성과·스킬)만 고친다.
  #
  # 사본메이커는 계정에 미리 만들어 둔 원본이다. 지우면 이 경로가 통째로 멈춘다.
  copy_from:
    default: 박예일 개발자용 사본메이커
    by_track:
      dev: 박예일 개발자용 사본메이커
      mes_erp: 박예일 개발자용 사본메이커
      pm: 박예일 AX개발자 사본메이커
      presales: 박예일 영업 사본메이커
      biz: 박예일 영업 사본메이커
    # 트랙보다 먼저 본다. '개발' 한 트랙 안에 인프라 공고와 LLM 공고가 같이
    # 들어오기 때문이다. 위에서부터 처음 걸리는 것을 쓴다.
    by_keyword:
      박예일 데브옵스 사본메이커:
        [devops, sre, 인프라, 쿠버네티스, kubernetes, 클라우드 엔지니어, 플랫폼 엔지니어, 시스템 엔지니어]
      박예일 AX개발자 사본메이커:
        [llm, rag, 생성형, 생성 ai, ai 엔지니어, ai엔지니어, mlops, 머신러닝, agent, 에이전트, ax]

  max_keep: 31          # 이보다 많으면 오래된 것부터 지운다 (사본메이커는 protect라 안 셈)
  max_age_days: 14      # 이보다 오래된 것은 지운다
  # 여기 적힌 제목은 **지우지도, 채우지도 않는다**(resume_editor.protected_titles).
  # 사본메이커를 지우거나 덮어쓰면 copy_from 경로가 통째로 막히고, 이미 오염된
  # 사본메이커에서 뜬 사본은 전부 같이 오염된다.
  #
  # '박예일 기본'을 여기 넣은 이유: 무인 사이클이 이력서 하나를 재사용하며
  # 덮어쓰던 시절(preview_resume_url, 2026-08-16 폐기) 그 대상이 기본 이력서였고,
  # 그 바람에 resume_builds에 '우리가 만든 것'으로 기록돼 cleanup 후보가 됐다.
  # 삭제 버튼이 없어 실제로 지워지진 않았지만, 근거를 코드 밖에 남겨둔다.
  protect:
    - 박예일 기본
    - 박예일 개발자용 사본메이커
    - 박예일 데브옵스 사본메이커
    - 박예일 AX개발자 사본메이커
    - 박예일 영업 사본메이커

# ---------------------------------------------------------------
# 포트폴리오 매칭 (2026-08-16 신설)
#
# 원티드 지원 폼은 이력서와 포트폴리오를 **같은 첨부파일 목록**에서 체크한다
# (실측 2026-08-16, 공고 362772/유에스소프트) — 별도 섹션이 아니다. 어느
# 포트폴리오를 낼지는 규칙이 아니라 에이전트가 공고 본문을 읽고 고른다.
# 트랙(대분류)보다 세밀한 결이라 키워드로는 못 가른다.
#
# title은 원티드에 실제로 업로드된 파일명 그대로 적는다. 여기 적은 값은
# 화면에 표시되는 그대로(NFC)지만, 지원 코드가 셀렉터에 넣을 때는 유니코드
# NFD로 정규화한다 — 실측으로 확인했다: 원티드는 업로드형 문서(포트폴리오
# PDF)의 파일명만 NFD로 렌더링하고, 사람이 직접 지은 이력서 제목(사본메이커
# 등)은 NFC로 렌더링한다. text-is() 셀렉터는 바이트 단위 비교라, 여기 NFC로
# 적은 title을 정규화 없이 그대로 셀렉터에 쓰면 화면에서 못 찾아 조용히
# 매칭에 실패한다(portfolio.py의 to_selector_text 참고).
#
# summary는 에이전트가 공고와 비교할 때만 쓴다 — 이력서처럼 지원서에
# 그대로 나가지 않는다. 실제 포트폴리오 파일(profile/generated 밖,
# ~/포트폴리오/*.md)의 내용을 보고 적었다.
# ---------------------------------------------------------------
portfolios:
  catalog:
    - title: 박예일_포트폴리오_AX개발자.pdf
      summary: >
        LLM을 기존 시스템에 붙여 사람이 지켜보지 않아도 운영되게 만든 사례
        중심. RAG 법률 상담(근거 인용 강제 + SHA-256 검증), 무인 채용지원
        파이프라인(LLM 0회 결정론 판정 + 되돌릴 수 없는 지점만 사람 승인),
        인턴 때 OCR+LLM 계약서 처리(인식률 95%)를 다룬다. AI 전환·LLM·RAG·
        AI 에이전트 관련 공고에 맞다.
    - title: 박예일_포트폴리오_풀스택.pdf
      summary: >
        프론트엔드부터 배포까지 한 기능을 끝까지 책임진 인턴 경험 중심.
        Dynamic Relation Resolution 조회 레이어(API 30% 감소), 권한 체계
        이중 방어, 낙관적 락 + SSE 실시간 동기화(동시성 충돌 월 10건→0건)를
        다룬다. 풀스택 개발자·프론트/백엔드 겸업 공고에 맞다.
    - title: 박예일_포트폴리오_데브옵스.pdf
      summary: >
        배포·인프라 자동화 중심. CI/CD로 배포시간 30분→10초 단축, 온프레미스
        →AWS 마이그레이션 주도, Docker 컨테이너화, Nginx 무중단 배포, GitLab
        운영을 다룬다. DevOps·SRE·인프라·클라우드 엔지니어 공고에 맞다.
    - title: 박예일_개발자포트폴리오.pdf
      summary: >
        특정 분야로 좁히지 않은 종합판. 인턴 경험(동시성 제어, 조회 레이어
        재설계)과 개인 프로젝트(RAG 법률 상담, 무인 채용 파이프라인, MCP
        서버, OPC UA 제조 모니터링)를 두루 다룬다. 백엔드·풀스택 중에서도
        세부 결이 뚜렷하지 않거나 개발 역량을 폭넓게 보여줘야 하는 공고에
        기본값으로 맞다.

limits:
  max_per_day: 10     # 하루(로컬 날짜) 선점 상한. 0이면 무제한 — 권장하지 않음
  max_per_run: 3      # 실행 1회당 상한. 루프 버그가 하루치를 한 번에 태우는 걸 막는다

# ---------------------------------------------------------------
# 이상 감지 — 파이프라인이 조용히 망가진 것을 알아챈다 (LLM 0회)
#
# 사람이 안 보는 시스템에서 "아무 일도 안 일어남"과 "망가져서 아무 일도 못 함"은
# 겉보기에 같습니다. 이 항목들이 그 둘을 가릅니다.
#
# 이 프로젝트에서 잡은 버그 셋을 전부 사람이 찾았습니다. 그중 둘(IMAGE_ONLY
# 628건, ESSAY_REQUIRED 52건)은 숫자만 봐도 이상했고, 아래 규칙이 잡았을 것입니다.
# ---------------------------------------------------------------
health:
  enabled: true

  # 한 blocker가 통과분의 이 비율을 넘으면 의심합니다.
  # 실측: IMAGE_ONLY가 628/702 = 89%였습니다.
  blocker_dominance: 0.7

  # 설계상 크게 나오는 게 정상인 blocker. 기준선이지 고장이 아닙니다.
  ignore_blockers:
    - SCORE_BELOW_BAR    # 기준 점수 미달. 대부분이 여기 걸리는 게 정상
    - RESUME_MISSING     # 트랙별 이력서를 아직 안 만든 상태

  # 자동지원 가능 건수가 직전 대비 이 비율 이상 줄면 의심합니다.
  actionable_drop: 0.9

  # 지원 실패가 이만큼 쌓이면 레시피가 깨졌을 수 있습니다.
  consecutive_failures: 3

  # 같은 징후로 반복해서 깨우지 않습니다. 무시되는 경보는 없는 것과 같습니다.
  cooldown_hours: 12

applicability:
  # 이 점수 미만이면 자동지원하지 않습니다. 무인 운영의 마지막 안전장치라
  # 보수적으로 잡으세요. 사람이 안 보는 상태에서 낮은 점수 공고에 이름을
  # 남기면 되돌릴 수 없습니다.
  min_fit_score: 75

  # 공고 본문이 이보다 짧으면 '요건 확인 불가'로 막습니다(NO_DETAIL).
  # 파이프라인은 scrape.detail_limit 건만 상세를 받으므로, 나머지는 본문이
  # 비어 있습니다. 요건을 읽지 않고 지원하는 일을 막는 장치입니다.
  min_description_chars: 200

  # 공고의 **필수요건**인데 이력서 사실 저장소에 근거가 없는 항목이 이보다
  # 많으면 자동지원하지 않습니다.
  #
  # 실측(2026-08-15): 132점 최고점 공고(에프앤에프 Java/Spring)에서 Java·Spring
  # 실무, Oracle, ERP가 전부 근거 없음이었습니다. 적합도 점수는 '공고에 그
  # 키워드가 있는지'만 세고 '내가 실제로 할 수 있는지'와 대조하지 않아서
  # 과대평가된 것입니다. 어셈블러가 공고를 읽으며 만든 목록이 그 사각지대를 메웁니다.
  max_required_gaps: 2

  # 마감까지 남은 일수가 이보다 적으면 자동지원하지 않습니다.
  # 마감 당일 지원은 폼 오류·서버 혼잡으로 실패해도 재시도할 시간이 없습니다.
  min_days_left: 1

  essays:
    # 자소서 문항을 LLM이 직접 쓰게 할지. false면 문항 있는 공고는
    # 전부 blocker(ESSAY_REQUIRED)로 막히고 사람에게 넘어갑니다.
    autowrite: false
    # 자동작성을 켜더라도 문항이 이보다 많으면 사람에게 넘깁니다.
    max_autowrite: 3

  # 트랙별로 어느 이력서를 낼지. 플랫폼에 저장된 이력서의 **제목 그대로** 씁니다.
  #
  # 실측(2026-08-15): 원티드 계정에 이력서가 15개 있는데 전부 개발 직군이었고,
  # 레시피가 '첫 번째(기본)'를 고르게 돼 있어 마케팅 공고에도 SW 엔지니어
  # 이력서가 나갈 뻔했습니다. 그래서 트랙별로 명시하게 바꿨습니다.
  #
  # 비워두면(null) 그 트랙은 RESUME_MISSING으로 막힙니다. 엉뚱한 이력서를
  # 보내느니 안 보내는 게 낫습니다 — 지원은 되돌릴 수 없습니다.
  #
  # 주의: '작성 중' 상태의 이력서는 지정하지 마세요. 미완성 이력서가 나갑니다.
  # 지금은 전부 비어 있습니다 = 어떤 트랙도 자동지원되지 않습니다.
  # MD SSOT(profile/resume/)로 이전하는 중이라 의도적으로 잠가둔 상태입니다.
  # 이력서를 새로 쌓으면서 하나씩 채우세요.
  # [은퇴] 트랙별로 미리 만들어둔 이력서를 고르던 매핑. 이제 공고마다 사본을
  # 만들어 이름을 붙이므로(resumes.copy_from) 쓰이지 않는다.
  # 값이 있으면 여전히 폴백으로 동작한다 — 사본 경로가 막혔을 때의 마지막 그물.
  resumes:
    wanted:
      dev: null
      mes_erp: null
      pm: null
      presales: null
      biz: null

  # 보유 중인 서류. 공고가 요구하는데 여기 없으면 DOC_MISSING으로 막힙니다.
  # 파일은 profile/documents/ 에 두세요.
  available_documents: []
    # - 졸업증명서
    # - 성적증명서

# ---------------------------------------------------------------
# 지원 대상 직무 트랙. 각 트랙의 키워드가 공고 제목/본문에 있으면
# 해당 트랙으로 분류되고 점수 가산을 받습니다.
# ---------------------------------------------------------------
tracks:
  dev:
    label: 개발
    weight: 100
    keywords:
      - 개발자, 백엔드, 프론트엔드, 풀스택, 웹개발, 서버개발, 소프트웨어
      # 자소설·대기업 공고는 'S/W 개발', 'SW개발' 표기를 자주 쓴다
      - s/w 개발, s/w개발, sw 개발, sw개발, s/w, 소프트웨어 개발
      - 웹 개발, 서버 개발, 응용개발, 응용 개발, 시스템 개발, 솔루션 개발
      - 프로그래머, 전산, 개발 인턴, it개발, it 개발
      - backend, frontend, fullstack, full-stack, software engineer, swe
      - node, nestjs, react, typescript, javascript, python, java, spring
      - devops, sre, 인프라, 클라우드, 플랫폼 엔지니어
      - 앱개발, android, ios, flutter
      - 데이터 엔지니어, ai 엔지니어, 머신러닝, mlops
      - 임베디드, 펌웨어, 제어 소프트웨어

  mes_erp:
    label: MES/ERP·생산관리(사무)
    weight: 95
    keywords:
      - mes, erp, scm, plm, wms, pms
      - 생산관리, 공정관리, 생산기획, 생산지원, 제조혁신, 스마트팩토리
      - 제조it, 생산it, 공장자동화, 설비관리 시스템
      - opc ua, scada, plc 연동, 산업 iot
      - sap, 더존, 영림원, 오라클 erp
    # 이 트랙은 '생산직 하드컷'을 무력화합니다 (사무직 생산관리는 지원 대상)
    overrides_hardcut: [TRADE_FIELD]

  pm:
    label: 기획/PM/PO
    weight: 90
    keywords:
      - 서비스기획, 프로덕트 매니저, 프로젝트 매니저, 프로덕트 오너
