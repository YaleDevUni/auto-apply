      - 정교사, 사서, 정사서, 임상심리사, 언어재활사
      - 항공정비사, 조종사, 객실승무원, 항해사, 기관사
      - 1종 대형, 지게차운전, 타워크레인, 굴착기운전, 중장비면허

  TRADE_FIELD:
    label: 현장 기능/생산직
    desc: 사무직이 아닌 현장 기능직·단순노무
    keywords:
      - 생산직, 조립원, 포장원, 상하차, 물류센터 단순, 피킹, 검수원
      - 배송기사, 택배기사, 운전기사, 배달, 라이더
      - 시공, 현장시공, 설비보수, 전기공사, 배관, 도장, 방수, 미장, 목공, 철근
